[package]
name = "rotten-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "airmirror"
path = "src/main.rs"

[[bin]]
name = "airmirror-gui"
path = "src/bin/airmirror_gui.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
eframe = { workspace = true }
rotten-capture = { workspace = true }
rotten-core = { workspace = true }
rotten-discovery = { workspace = true }
rotten-pairing = { workspace = true }
rotten-protocol = { workspace = true }
rotten-video = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
plist = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }

[features]
default = ["encode-source"]
encode-source = ["rotten-video/software-encode-source"]
encode-dll = ["rotten-video/software-encode-dll"]

[package.metadata.deb]
name = "airmirror"
maintainer = "RottingApple Contributors"
copyright = "2026, RottingApple Contributors"
license-file = ["../LICENSE", "0"]
extended-description = "AirPlay screen mirroring sender for Windows PCs"
